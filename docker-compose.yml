version: '3.9'
services:
  db:
    image: postgres:15
    container_name: myanclinic_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myanclinic
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: myanclinic_backend
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/myanclinic
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/main"

volumes:
  db_data:
